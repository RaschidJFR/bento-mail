name: Test

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Run tests against a MongoDB replica set
        run: npx mongodb-runner -t replset exec -- sh -c 'export TEST_MONGODB_URI="$MONGODB_URI"; npm test -- --run'
